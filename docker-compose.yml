services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - ENV=${ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HOST=0.0.0.0
      - PORT=8080
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-car-mechanic-rag}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-car-mechanic-rag-users}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-43200}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - DB_URL=${DB_URL:-postgresql+psycopg://ai:ai@postgres:5432/ai}
      - KB_TABLE=${KB_TABLE:-mechanic_kb}
      - KB_MAX_RESULTS=${KB_MAX_RESULTS:-12}
      - EMBED_MODEL=${EMBED_MODEL:-models/text-embedding-004}
      - EMBED_DIMENSIONS=${EMBED_DIMENSIONS:-768}
      - EMBED_BATCH=${EMBED_BATCH:-true}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-100}
      - DATASET_DIR=${DATASET_DIR:-/data/dataset_mecanica_full}
      - INGEST_CONCURRENCY=${INGEST_CONCURRENCY:-8}
      - INGEST_SKIP_IF_EXISTS=${INGEST_SKIP_IF_EXISTS:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Monte seu dataset local (pasta com .jsonl) aqui:
      - ./dataset_mecanica_full:/data/dataset_mecanica_full:ro

volumes:
  pgdata:
